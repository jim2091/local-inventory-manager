appId: com.local.inventorymanager
productName: 재고관리 프로그램

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'

asarUnpack:
  - resources/**

win:
  executableName: InventoryManager

nsis:
  artifactName: '재고관리프로그램-${version}-Setup.${ext}'
  shortcutName: 재고관리 프로그램
  uninstallDisplayName: 재고관리 프로그램

  createDesktopShortcut: always
  createStartMenuShortcut: true

  oneClick: true
  perMachine: false
  runAfterFinish: true

npmRebuild: false